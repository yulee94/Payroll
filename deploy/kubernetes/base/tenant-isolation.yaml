apiVersion: v1
kind: ResourceQuota
metadata:
  name: bitween-prod-quota
  labels:
    app.kubernetes.io/name: bitween-tenant-boundary
    bitween.io/tenant-scope: tenant-acme
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    requests.ephemeral-storage: 4Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    limits.ephemeral-storage: 8Gi
    persistentvolumeclaims: "8"
    pods: "32"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: bitween-prod-limits
  labels:
    app.kubernetes.io/name: bitween-tenant-boundary
    bitween.io/tenant-scope: tenant-acme
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 128Mi
        ephemeral-storage: 64Mi
      default:
        cpu: 500m
        memory: 512Mi
        ephemeral-storage: 512Mi
      max:
        cpu: "2"
        memory: 4Gi
        ephemeral-storage: 2Gi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bitween-release-operator
  labels:
    app.kubernetes.io/name: bitween-release-operator
    bitween.io/tenant-scope: tenant-acme
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bitween-release-operator
  labels:
    app.kubernetes.io/name: bitween-release-operator
    bitween.io/tenant-scope: tenant-acme
subjects:
  - kind: Group
    name: bitween-release-operators
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bitween-release-operator
