apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bitween-rustfs
  labels:
    app.kubernetes.io/name: bitween-rustfs
    bitween.io/service-tier: object
spec:
  serviceName: bitween-rustfs
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: bitween-rustfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bitween-rustfs
        bitween.io/data-classification: restricted
        bitween.io/service-tier: object
      annotations:
        bitween.io/audit-chain: required
        bitween.io/object-versioning: required
        kubectl.kubernetes.io/default-container: rustfs
    spec:
      serviceAccountName: bitween-rustfs
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.0-beta.7
          imagePullPolicy: IfNotPresent
          args: ["/data"]
          ports:
            - name: s3
              containerPort: 9000
          env:
            - name: RUSTFS_ADDRESS
              value: :9000
            - name: RUSTFS_CONSOLE_ENABLE
              value: "false"
            - name: RUSTFS_VOLUMES
              value: /data
            - name: RUSTFS_OBS_ENVIRONMENT
              value: production
            - name: RUSTFS_OBS_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4318
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: bitween-rustfs-auth
                  key: access-key
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: bitween-rustfs-auth
                  key: secret-key
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 2Gi
          startupProbe:
            httpGet:
              path: /health
              port: s3
            failureThreshold: 60
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: s3
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: logs
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 500Gi
