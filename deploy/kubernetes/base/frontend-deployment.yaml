apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitween-frontend
  labels:
    app.kubernetes.io/name: bitween-frontend
    bitween.io/service-tier: edge
spec:
  replicas: 2
  revisionHistoryLimit: 10
  minReadySeconds: 10
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bitween-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bitween-frontend
        bitween.io/data-classification: internal
        bitween.io/service-tier: edge
      annotations:
        bitween.io/audit-chain: required
        bitween.io/slo-bundle: deploy/kubernetes/slo/bitween-frontend.availability.openslo.yaml
        kubectl.kubernetes.io/default-container: bitween-frontend
    spec:
      serviceAccountName: bitween-frontend
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bitween-frontend
          image: ghcr.io/bitween/platform-ui:2026.06.10
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: bitween-runtime-config
          env:
            - name: BITWEEN_API_BASE_URL
              value: https://admin-api.bitween.acme.internal
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: cache
              mountPath: /var/cache/bitween
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 128Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
