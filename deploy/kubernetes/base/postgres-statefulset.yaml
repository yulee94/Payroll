apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bitween-postgres
  labels:
    app.kubernetes.io/name: bitween-postgres
    bitween.io/service-tier: data
spec:
  serviceName: bitween-postgres
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: bitween-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bitween-postgres
        bitween.io/data-classification: restricted
        bitween.io/service-tier: data
      annotations:
        bitween.io/audit-chain: required
        bitween.io/backup-policy: point-in-time-recovery
        kubectl.kubernetes.io/default-container: postgres
    spec:
      serviceAccountName: bitween-postgres
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: docker.io/library/postgres:17.5-bookworm
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: bitween
            - name: POSTGRES_USER
              value: bitween_app
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bitween-postgres-auth
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 256Mi
            limits:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 2Gi
          startupProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -U bitween_app -d bitween -h 127.0.0.1"]
            failureThreshold: 60
            periodSeconds: 2
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -U bitween_app -d bitween -h 127.0.0.1"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -U bitween_app -d bitween -h 127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "pg_ctl -D /var/lib/postgresql/data/pgdata -m fast -w stop"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 200Gi
