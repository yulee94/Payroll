apiVersion: batch/v1
kind: Job
metadata:
  name: bitween-postgres-migrate
  labels:
    app.kubernetes.io/name: bitween-postgres-migrate
    bitween.io/service-tier: release
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bitween-postgres-migrate
        bitween.io/data-classification: restricted
        bitween.io/service-tier: release
      annotations:
        bitween.io/audit-chain: required
        bitween.io/migration-target: postgres
        bitween.io/rollback-runbook: deploy/kubernetes/runbooks/release-rollback.md
    spec:
      serviceAccountName: bitween-migrations
      automountServiceAccountToken: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres-migrate
          image: ghcr.io/bitween/payroll-api:2026.06.10
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/postgres_migrate"]
          envFrom:
            - configMapRef:
                name: bitween-runtime-config
          env:
            - name: BITWEEN_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: bitween-runtime-secrets
                  key: postgres-dsn
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
