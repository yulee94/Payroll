##
## Reindeer Config for Bitween's full-Rust backend transition.
##
## Reindeer owns third-party Rust Buck rules. Do not hand-edit
## third-party/rust/BUCK; update Cargo.toml/Cargo.lock and rerun:
##
##   reindeer --config reindeer.toml vendor
##   reindeer --config reindeer.toml buckify
##

manifest_path = "Cargo.toml"
third_party_dir = "third-party/rust"
precise_srcs = true
vendor = true
third_party_metadata = true
unresolved_fixup_error = true

[buck]
file_name = "BUCK"
rust_library = "cargo.rust_library"
rust_binary = "cargo.rust_binary"
buildscript_genrule = "buildscript_run"
buckfile_imports = """
load("@prelude//rust:cargo_buildscript.bzl", "buildscript_run")
load("@prelude//rust:cargo_package.bzl", "cargo")
"""
generated_file_header = """
##
## @generated by reindeer
## Do not edit by hand.
##
## See README.md for update directions.
##
"""
