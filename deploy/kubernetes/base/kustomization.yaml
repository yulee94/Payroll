apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bitween-prod
resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - configmap.yaml
  - services.yaml
  - api-deployment.yaml
  - frontend-deployment.yaml
  - postgres-statefulset.yaml
  - rustfs-statefulset.yaml
  - postgres-migrate-job.yaml
  - worker-cronjobs.yaml
  - observability.yaml
  - gateway-httproute.yaml
  - tenant-isolation.yaml
  - networkpolicies.yaml
  - poddisruptionbudgets.yaml
commonLabels:
  app.kubernetes.io/part-of: bitween-platform
  app.kubernetes.io/managed-by: gitops
images:
  - name: ghcr.io/bitween/payroll-api
    newTag: "2026.06.10"
  - name: ghcr.io/bitween/platform-ui
    newTag: "2026.06.10"
  - name: docker.io/library/postgres
    newTag: "17.5-bookworm"
  - name: rustfs/rustfs
    newTag: "1.0.0-beta.7"
