apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: bitween-api
  labels:
    app.kubernetes.io/name: bitween-api
    bitween.io/observability-pack: internal-korea
spec:
  namespaceSelector:
    matchNames:
      - bitween-prod
  selector:
    matchLabels:
      app.kubernetes.io/name: bitween-api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: false
      relabelings:
        - targetLabel: service_namespace
          replacement: bitween
        - targetLabel: data_classification
          replacement: confidential
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: bitween-frontend
  labels:
    app.kubernetes.io/name: bitween-frontend
    bitween.io/observability-pack: internal-korea
spec:
  namespaceSelector:
    matchNames:
      - bitween-prod
  selector:
    matchLabels:
      app.kubernetes.io/name: bitween-frontend
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: false
      relabelings:
        - targetLabel: service_namespace
          replacement: bitween
        - targetLabel: data_classification
          replacement: internal
