apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bitween-web
  labels:
    app.kubernetes.io/name: bitween-web-route
spec:
  parentRefs:
    - name: bitween-edge
      namespace: bitween-system
      sectionName: https
  hostnames:
    - bitween.acme.internal
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: bitween-api
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: bitween-frontend
          port: 8080
