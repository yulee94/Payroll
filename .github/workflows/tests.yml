name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

jobs:
  unittest:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run focused tests
        run: |
          python -m unittest tests.test_attendance_import tests.test_payroll_api_adapter tests.test_payroll_api_contract tests.test_payroll_automation tests.test_payroll_operation_policy tests.test_payroll_readiness tests.test_payroll_ui_bridge tests.test_payroll_settings_ui_bridge tests.test_preview_grid_filter tests.test_workflow tests.test_org_access -v

  rust:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Run Rust tests
        run: cargo test --workspace

  frontend-types:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Type-check frontend contracts
        working-directory: frontend
        run: npm run typecheck

  rust-buck2-reindeer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Install Buck2
        uses: dtolnay/install-buck2@latest

      - name: Install Reindeer
        run: cargo install --locked --git https://github.com/facebookincubator/reindeer --rev d1638c7675fe31013f101f39cd18248f40b5ce6c reindeer

      - name: Verify Reindeer-generated Buck rules and vendor tree are current
        run: |
          reindeer --config reindeer.toml vendor
          reindeer --config reindeer.toml buckify
          git diff --exit-code -- third-party/rust/BUCK third-party/rust/vendor

      - name: Build Rust payroll API with Buck2
        run: buck2 build //crates/payroll-api:payroll_api

      - name: Test Rust payroll API with Buck2
        run: buck2 test //crates/payroll-api:payroll_api_test
