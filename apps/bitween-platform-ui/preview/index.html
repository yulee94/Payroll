    <style>
      :root{--accent:#1f3864;--accent-soft:#e8f2fc;--bg:#f5f7fa;--border:#dde5ee;--card:#fff;--danger:#b91c1c;--danger-soft:#fee2e2;--divider:#e7edf4;--input:#fbfcfe;--muted:#667085;--sidebar:#edf3fa;--success:#047857;--success-soft:#dff6ec;--text:#111827;--warning:#b45309;--warning-soft:#fef3c7;color-scheme:light;font-family:Inter,"Segoe UI",Arial,sans-serif}*{box-sizing:border-box}body{background:var(--bg);color:var(--text);margin:0}button,input{font:inherit}button{cursor:pointer}.login-page{align-items:center;display:flex;min-height:100vh;padding:24px}.login-grid{align-items:stretch;display:grid;gap:24px;grid-template-columns:minmax(320px,1.2fr) minmax(320px,.8fr);margin:0 auto;max-width:1120px;width:100%}.login-hero{background:var(--accent);border-radius:8px;color:var(--card);display:flex;flex-direction:column;justify-content:space-between;min-height:420px;padding:28px}.hero-copy{display:grid;gap:16px}.brand{font-size:28px;font-weight:800;letter-spacing:0}.hero-title{font-size:28px;font-weight:800;letter-spacing:0;line-height:1.28;margin:0;max-width:560px}.hero-desc{color:#eff6ff;font-size:15px;font-weight:650;line-height:1.55;margin:0;max-width:500px}.hero-pills,.filters,.action-row{display:flex;flex-wrap:wrap;gap:8px}.hero-pill{background:rgb(255 255 255 / 14%);border:1px solid rgb(255 255 255 / 26%);border-radius:6px;color:var(--card);font-size:13px;font-weight:750;padding:9px 12px}.card{background:var(--card);border:1px solid var(--border);border-radius:8px;display:grid;gap:14px;padding:18px}.login-card{align-content:center}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:800}.field input{background:var(--input);border:1px solid var(--border);border-radius:6px;color:var(--text);min-height:44px;padding:10px 12px}.btn{align-items:center;border:1px solid transparent;border-radius:6px;display:inline-flex;font-size:14px;font-weight:800;justify-content:center;min-height:42px;padding:10px 16px}.btn:active{opacity:.86}.btn.primary{background:var(- olor:var(--danger)}.tone-neutral{background:var(--accent-soft);color:var(--muted)}.metric-grid,.card-grid,.step-grid,.queue-grid,.launcher-grid,.action-panels{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.metric-card,.mini-card,.queue-card,.launcher-card,.step-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;display:grid;gap:8px;padding:14px}.metric-card{border-left:4px solid var(--muted)}.metric-value{font-size:24px;font-weight:850;line-height:1.2}.readiness-card,.step-card,.launcher-card{border-top:4px solid var(--muted)}.queue-head{align-items:start;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}.filter-chip{background:var(--input);border:1px solid var(--border);border-radius:6px;color:var(--muted);font-size:13px;font-weight:800;padding:8px 12px}.filter-chip.active{background:var(--accent);border-color:var(--accent);color:var(--card)}.table{border:1px solid var(--border);border-radius:8px;overflow:hidden}.table-row{align-items:center;border-top:1px solid var(--divider);display:grid;gap:12px;grid-template-columns:1.1fr .9fr .8fr 1.4fr;padding:12px}.table-row.header{background:var(--accent-soft);border-top:0;color:var(--accent);font-size:13px;font-weight:850}.table-row span{min-width:0}.toast{background:#172b4d;border-radius:8px;bottom:18px;color:var(--card);font-size:13px;font-weight:750;left:50%;opacity:0;padding:12px 14px;position:fixed;transform:translate(-50%,12px);transition:180ms ease;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:980px){.shell{grid-template-columns:1fr}.sidebar{border-bottom:1px solid var(--border);border-right:0}.nav{display:flex;overflow-x:auto}.nav-button{min-width:128px}.topbar{display:grid}}@media(max-width:760px){.login-grid{grid-template-columns:1fr}.table{border:0;display:grid;gap:12px}.table-row.header{display:none}.table-row{background:var(--input);border:1px solid var(--border);border-radius:8px;grid-template-columns:1fr}   <body>
    <main id="app"></main>
    <script>
      const tones={ready:"tone-ready",attention:"tone-attention",blocked:"tone-blocked",neutral:"tone-neutral"};
      const nav=[
        ["home","플랫폼 홈","Launcher","오늘의 업무, 빠른 실행, 플랫폼 상태를 한 화면에서 확인합니다.","#64748B"],
        ["payroll","급여","Payroll","급여 자동화 준비 상태, 산출 진입, 월별 보고와 설정을 관리합니다.","#1F3864"],
        ["hr","HR","People","직원 명부, 근태, 연차, 계약, 증명서 흐름을 정리합니다.","#0D9488"],
        ["workflow","전자결재","Workflow","기안, 결재 대기, 진행 문서, 회람 상태를 추적합니다.","#2563EB"],
        ["archive","자료함","Archive","법인, 사업장, 월별 산출 자료와 보고서를 찾고 미리 봅니다.","#475569"],
        ["ai","AI","Assistant","업무 문맥을 기반으로 요약, 초안, 확인 질문을 도와줍니다.","#7C3AED"],
        ["admin","관리자","Admin","법인, 사용자 권한, 조직과 운영 설정을 관리합니다.","#B45309"],
        ["settings","설정","Settings","개인 화면, 급여 운영 기준, 플랫폼 환경을 조정합니다.","#0F766E"]
      ].map(([id,label,eyebrow,description,accent])=>({id,label,eyebrow,description,accent}));
      const state={authed:false,active:"home",filter:"전체"};
      const metrics=[["오늘 처리할 업무","9건","급여, 결재, 자료 확인 포함","attention"],["연동 준비 완료","5개","연동 준비 항목 포함","ready"],["확인 필요","2건","권한 또는 정책 확인 대기","blocked"],["최근 자료","12개","월별 보고서와 업로드 문서","neutral"]];
      const readiness=[["근로자 명부","연동 대기","최근 명부 기준과 급여 대상자 상태를 확인하세요.","attention"],["운영 기준","기준 검토","지급일, 입력 방식, 근태 반올림 기준을 확인합니다.","neutral"],["월별 산출","자료함 준비","최근 처리 월과 보고서 보관 상태를 확인합니다.","ready"],["자료 연동","확인 필요","외부 자료 연동 전 입력 누락 여부를 확인합니다.","attention"]];
      const payrollSteps=[["01","운영 기준 확인","지급일, 보험/세액 기준, 급여 항목 매핑을 검토합니다.","먼저 확인","attention"],["02","입력 자료 준비","명부, 근태, 수당/공제 입력 파일을 업로드할 자리입니다.","대기","neutral"],["03","결과 미리보기","산출 결과, 오류, 변경 이력을 한 화면에서 비교합니다.","준비됨","ready"],["04","자료함 저장","월별 산출물과 보고서를 저장하고 추후 조회합니다.","연결 예정","neutral"]];
      const queue=[["6월 급여 산출 준비","급여 자동화","급여 담당","오늘","확인 필요","attention"],["전자결재 대기 문서","워크플로우","승인권자","D-1","3건","neutral"],["자료함 최근 보고서","아카이브","운영팀","상시","미리보기 가능","ready"]];
      const payrollSettings=[["설정 대상","법인 기본","급여 담당","사업장별 예외 여부 확인","neutral"],["휴업수당 지급률","법정 기준 확인","급여 담당","최저 기준 이상 입력값 검토","attention"],["월 기본근로시간","209시간","운영 관리자","사업장별 고정/대체 방식 표시","ready"]];
      const previewRows=[["Excel 미리보기","시트 선택","자료함","표/텍스트 보기 전환","ready"],["필터 초기화","지원","사용자","필터 적용 상태 안내","neutral"],["수정본 업로드","권한 필요","급여 담당","현재 scope 파일일 때만 노출","attention"]];
      const modules={
        hr:dash("HR 운영 현황","직원 명부, 근태, 증명서 요청을 한 화면에서 추적합니다.",["전체","입사/퇴사","근태","증명서"],[["재직 직원","48명","법인 전체","ready"],["근태 확인","6건","월말 마감 전 확인","attention"],["증명서 요청","2건","담당자 처리 대기","neutral"]],[["근태 누락","확인 필요","인사 담당","6월 2주차 누락 항목 확인","attention"],["재직증명서","접수","운영팀","발급 양식 검토","neutral"]]),
        workflow:dash("전자결재 업무함","기안, 승인, 반려, 회람 문서를 상태별로 정리합니다.",["전체","결재 대기","진행 중","반려"],[["결재 대기","3건","오늘 처리 권장","attention"],["임시저장","1건","기안자 작성 중","neutral"],["완료 문서","18건","이번 달 기준","ready"]],[["급여 지급 품의","결재 대기","대표 승인","금액 요약 확인","attention"],["계약서 검토","진행 중","법무 담당","첨부 파일 회람","neutral"]]),
        archive:dash("자료함","월별 급여 산출물, 보고서, 업로드 문서를 안전하게 찾습니다.",["전체","급여","계약","보고서"],[["최근 보고서","12개","3개월 내 생성","ready"],["정리 필요","4개","분류 대기","attention"],["공유 링크","0개","외부 공유 없음","ready"]],[["2026년 5월 급여 보고서","보관됨","급여 담당","미리보기","ready"],["근태 원본 파일","분류 대기","운영팀","폴더 지정","attention"]]),
        ai:dash("AI 업무 지원","급여/HR/결재 문맥을 읽고 요약과 검토 질문을 준비합니다.",["전체","요약","초안","검토"],[["추천 작업","5개","현재 화면 기준","ready"],["검토 대기","2건","사람 확인 필요","attention"],["정책 문맥","확인 전","업무 기준 확인 후 사용","neutral"]],[["급여 오류 요약","추천","AI","오류 행 설명 생성","ready"],["결재 의견 초안","검토 필요","사용자","문서 맥락 확인","attention"]]),
        admin:dash("관리자 콘솔","사용자, 권한, 법인 운영 설정을 분리해서 관리합니다.",["전체","권한","법인","감사"],[["활성 사용자","14명","초대 완료 계정","ready"],["권한 검토","2건","승인권자 확인","attention"],["감사 로그","정상","최근 오류 없음","ready"]],[["신규 사용자 초대","검토 중","관리자","역할 지정","attention"],["법인 정보","정상","운영 관리자","정기 검토","ready"]]),
        settings:dash("설정","개인 화면, 급여 운영 기준, 알림, 접근 환경을 정리합니다.",["전체","개인","급여","알림"],[["프로필","완료","기본 정보 설정됨","ready"],["급여 기준","확인 필요","지급일/반올림 기준","attention"],["알림","4개","업무별 수신 설정","neutral"]],[["급여 운영 기준","확인 필요","급여 담당","지급일과 반올림 기준 확인","attention"],["화면 밀도","권장","개인","업무형 레이아웃 유지","ready"]])
      };
      function dash(title,subtitle,filters,metrics,rows){return{title,subtitle,filters,metrics,rows}}
      function badge(text,tone="neutral"){return `<span class="badge ${tones[tone]}">${text}</span>`}
      function btn(text,target,variant="secondary"){return `<button class="btn ${variant}" data-target="${target}">${text}</button>`}
      function tone(t){return{ready:"#047857",attention:"#B45309",blocked:"#B91C1C",neutral:"#667085"}[t]||"#667085"}
      function section(eyebrow,title,desc,action=""){return `<div class="section-head"><div class="section-title">${eyebrow?`<span class="eyebrow">${eyebrow}</span>`:""}<h2>${title}</h2><p>${desc}</p></div>${action}</div>`}
      function metricGrid(items){return `<div class="metric-grid">${items.map(([l,v,h,t])=>`<article class="metric-card" style="border-left-color:${tone(t)}"><span class="helper">${l}</span><strong class="metric-value" style="color:${tone(t)}">${v}</strong><span>${h}</span></article>`).join("")}</div>`}
      function table(rows){return `<div class="table"><div class="table-row header"><span>구분</span><span>상태</span><span>담당</span><span>다음 작업</span></div>${rows.map(([c,s,o,n,t])=>`<div class="table-row"><span><strong>${c}</strong></span><span>${badge(s,t)}</span><span>${o}</span><span>${n}</span></div>`).join("")}</div>`}
      function renderLogin(){return `<section class="login-page"><div class="login-grid"><div class="login-hero">${badge("B2B operations","ready")}<div class="hero-copy"><div class="brand">Bitween</div><h1 class="hero-title">로그인 후 권한에 맞는 업무 화면으로 이동합니다.</h1><p class="hero-desc">급여, HR, 전자결재, 자료함, AI, 관리자 화면을 하나의 업무 플랫폼 경험으로 정리합니다.</p></div><div class="hero-pills"><span class="hero-pill">권한 기반 메뉴</span><span class="hero-pill">업무별 상태</span><span class="hero-pill">자료 보호</span></div></div><form class="card login-card" id="login-form">${section("Secure sign in","로그인","법인 계정으로 접속하면 권한에 맞는 업무 화면으로 이동합니다.")}<label class="field"><span>법인 코드</span><input placeholder="예: BTW-2026" /></label><label class="field"><span>아이디</span><input placeholder="업무 계정 아이디" /></label><label class="field"><span>비밀번호</span><input type="password" placeholder="비밀번호" /></label><button class="btn primary" type="submit">플랫폼 홈으로 이동</button><div class="notice">${badge("관리자 발급")}<span class="helper">계정이 없으면 관리자에게 법인 계정 발급을 요청하세요.</span></div></form></div></section>`}
      function renderShell(){const active=nav.find(n=>n.id===state.active)||nav[0];return `<section class="shell"><aside class="sidebar"><div class="brand-block"><strong>Bitween</strong><span>Business Platform</span></div><nav class="nav">${nav.map(n=>`<button class="nav-button ${n.id===active.id?"active":""}" data-target="${n.id}" style="${n.id===active.id?`border-left-color:${n.accent}`:""}"><span>${n.eyebrow}</span><strong>${n.label}</strong></button>`).join("")}</nav></aside><div class="main"><header class="topbar"><div class="topbar-copy"><span class="eyebrow">${active.eyebrow}</span><h1>${active.label}</h1><span class="muted">${active.description}</span></div>${badge("법인 운영 콘솔")}</header><div class="content">${screen(active.id)}</div></div></section><div class="toast" id="toast">화면이 업데이트되었습니다.</div>`}
      function screen(id){if(id==="home")return home();if(id==="payroll")return payroll();return module(id)}
      function home(){return `<section class="card">${section("Overview","오늘의 플랫폼 상태","중요한 업무 상태를 먼저 보고 필요한 메뉴로 바로 이동합니다.",btn("급여 준비 확인","payroll"))}${metricGrid(metrics)}</section><section class="card">${section("","오늘의 업무","처리 우선순위가 높은 업무를 카드로 정리합니다.")}<div class="queue-grid">${queue.map(([t,m,o,d,s,to])=>`<article class="queue-card"><div class="queue-head">${badge(s,to)}<span class="helper">${d}</span></div><strong>${t}</strong><span class="helper">${m} · ${o}</span></article>`).join("")}</div></section><section class="card">${section("","플랫폼 바로가기","업무별 화면이 같은 구조로 이어지도록 정리했습니다.")}<div class="launcher-grid">${nav.filter(n=>n.id!=="home").map(n=>`<article class="launcher-card" style="border-top-color:${n.accent}"><span class="eyebrow">${n.eyebrow}</span><strong>${n.label}</strong><span class="helper">${n.description}</span>${btn("열기",n.id,"ghost")}</article>`).join("")}</div></section>`}
      function payroll(){return `<section class="card">${section("Readiness","급여 자동화 준비 현황","산출 전 필요한 기준과 자료 상태를 먼저 확인합니다.",btn("설정 확인","settings"))}<div class="card-grid">${readiness.map(([t,v,d,to])=>`<article class="mini-card readiness-card" style="border-top-color:${tone(to)}"><span class="helper">${t}</span><strong class="metric-value" style="color:${tone(to)}">${v}</strong><span>${d}</span></article>`).join("")}</div></section><section class="card">${section("Payroll flow","급여 산출 작업 흐름","운영 기준 확인부터 입력 자료 준비, 결과 검토, 자료함 저장까지 순서대로 진행합니다.",btn("급여 설정 확인","settings"))}<div class="step-grid">${payrollSteps.map(([i,t,d,s,to])=>`<article class="step-card" style="border-top-color:${tone(to)}"><span class="eyebrow">${i}</span>${badge(s,to)}<strong>${t}</strong><span class="helper">${d}</span></article>`).join("")}</div><div class="action-row">${btn("산출 화면 유지","payroll","primary")}${btn("월별 자료함","archive")}${btn("AI 검토 준비","ai","ghost")}</div></section><section class="card">${section("Settings summary","급여 산출 설정 요약","산출 전 확인해야 할 핵심 급여 기준을 한눈에 검토합니다.",btn("상세 설정","settings"))}${table(payrollSettings)}</section><section class="card">${section("Preview and archive","파일 미리보기 작업","Excel 미리보기, 시트 선택, 필터 초기화, 수정본 업로드 같은 사용자 흐름을 분리했습니다.",btn("자료함 열기","archive"))}${table(previewRows)}</section>`}
      function module(id){const d=modules[id];if(!d)return"";return `<section class="card">${section(nav.find(n=>n.id===id)?.eyebrow||"",d.title,d.subtitle,btn(primary(id),id,"primary"))}${metricGrid(d.metrics)}</section><section class="card">${section("","업무 목록","필터로 상태를 좁히고 필요한 다음 작업을 확인합니다.",btn(secondary(id),next(id)))}<div class="filters">${d.filters.map(f=>`<button class="filter-chip ${state.filter===f?"active":""}" data-filter="${f}">${f}</button>`).join("")}</div>${table(d.rows)}</section><div class="action-panels"><section class="card"><strong>${primary(id)}</strong><span class="helper">주요 업무 화면으로 이동합니다.</span>${btn("이동",id,"ghost")}</section><section class="card"><strong>${secondary(id)}</strong><span class="helper">연관 업무 화면을 이어서 확인합니다.</span>${btn("이동",next(id),"ghost")}</section></div>`}
      function primary(id){return{hr:"직원 명부 보기",workflow:"결재함 열기",archive:"최근 자료 보기",ai:"추천 작업 보기",admin:"권한 검토",settings:"급여 설정 보기"}[id]||"열기"}
      function secondary(id){return{hr:"급여 준비로 이동",workflow:"자료함 확인",archive:"급여 화면으로 이동",ai:"설정 확인",admin:"설정으로 이동",settings:"급여 화면으로 이동"}[id]||"연관 화면"}
      function next(id){return{hr:"payroll",workflow:"archive",archive:"payroll",ai:"settings",admin:"settings",settings:"payroll"}[id]||"home"}
      function toast(text){const t=document.getElementById("toast");if(!t)return;t.textContent=text;t.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove("show"),1300)}
      function bind(){document.querySelectorAll("[data-target]").forEach(el=>el.addEventListener("click",()=>{state.authed=true;state.active=el.dataset.target;state.filter="전체";render();toast(`화면 이동: ${nav.find(n=>n.id===state.active)?.label||"홈"}`)}));document.querySelectorAll("[data-filter]").forEach(el=>el.addEventListener("click",()=>{state.filter=el.dataset.filter;render();toast(`${state.filter} 필터가 선택되었습니다.`)}));document.getElementById("login-form")?.addEventListener("submit",e=>{e.preventDefault();state.authed=true;state.active="home";render();toast("플랫폼 홈으로 이동했습니다.")})}
      function render(){document.getElementById("app").innerHTML=state.authed?renderShell():renderLogin();bind()}
      render();
    </script>
  </body>
</html>
