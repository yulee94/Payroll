name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

jobs:
  frontend-types:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Type-check frontend contracts
        working-directory: frontend
        run: npm run typecheck

  bitween-platform-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install platform UI dependencies
        working-directory: apps/bitween-platform-ui
        run: npm install

      - name: Verify platform UI runtime/auth/i18n guards
        working-directory: apps/bitween-platform-ui
        run: |
          npm run verify:no-python-source
          npm run verify:buck2-only
          npm run verify:performance-gates
          npm run verify:security-gates
          npm run verify:kubernetes-manifests
          npm run verify:auth-session
          npm run verify:office-contract
          npm run verify:auth-routes
          npm run verify:route-authorization
          npm run verify:signed-out-auth-ux
          npm run verify:data-mode
          npm run verify:i18n
          npm run check:strict-config

      - name: Type-check platform UI
        working-directory: apps/bitween-platform-ui
        run: npm run typecheck

      - name: Audit platform UI production dependencies
        working-directory: apps/bitween-platform-ui
        run: npm audit --omit=dev --audit-level=moderate

  rust-buck2-reindeer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Install Buck2
        uses: dtolnay/install-buck2@latest

      - name: Install Reindeer
        run: cargo install --locked --git https://github.com/facebookincubator/reindeer --rev d1638c7675fe31013f101f39cd18248f40b5ce6c reindeer

      - name: Verify Reindeer-generated Buck rules and vendor tree are current
        run: |
          reindeer --config reindeer.toml vendor
          reindeer --config reindeer.toml buckify
          git diff --exit-code -- third-party/rust/BUCK third-party/rust/vendor

      - name: Build Rust payroll API tools with Buck2
        run: |
          buck2 build //crates/payroll-api:payroll_api
          buck2 build //crates/payroll-api:platform_live_view
          buck2 build //crates/payroll-api:auth_session_validate
          buck2 build //crates/payroll-api:authz_decision
          buck2 build //crates/payroll-api:hr_employee_store
          buck2 build //crates/payroll-api:archive_intake_store
          buck2 build //crates/payroll-api:user_preference_store
          buck2 build //crates/payroll-api:workflow_template_store
          buck2 build //crates/payroll-api:postgres_migrate
          buck2 build //crates/payroll-api:cloud_native_audit_worker

      - name: Check Rust payroll API tools with Buck2
        run: |
          buck2 build '//crates/payroll-api:payroll_api[check]'
          buck2 build '//crates/payroll-api:platform_live_view[check]'
          buck2 build '//crates/payroll-api:auth_session_validate[check]'
          buck2 build '//crates/payroll-api:authz_decision[check]'
          buck2 build '//crates/payroll-api:hr_employee_store[check]'
          buck2 build '//crates/payroll-api:archive_intake_store[check]'
          buck2 build '//crates/payroll-api:user_preference_store[check]'
          buck2 build '//crates/payroll-api:workflow_template_store[check]'
          buck2 build '//crates/payroll-api:postgres_migrate[check]'
          buck2 build '//crates/payroll-api:cloud_native_audit_worker[check]'

      - name: Lint Rust payroll API tools with Buck2
        run: |
          buck2 build '//crates/payroll-api:payroll_api[clippy.txt]'
          buck2 build '//crates/payroll-api:platform_live_view[clippy.txt]'
          buck2 build '//crates/payroll-api:auth_session_validate[clippy.txt]'
          buck2 build '//crates/payroll-api:authz_decision[clippy.txt]'
          buck2 build '//crates/payroll-api:hr_employee_store[clippy.txt]'
          buck2 build '//crates/payroll-api:archive_intake_store[clippy.txt]'
          buck2 build '//crates/payroll-api:user_preference_store[clippy.txt]'
          buck2 build '//crates/payroll-api:workflow_template_store[clippy.txt]'
          buck2 build '//crates/payroll-api:postgres_migrate[clippy.txt]'
          buck2 build '//crates/payroll-api:cloud_native_audit_worker[clippy.txt]'

      - name: Test Rust payroll API tools with Buck2
        run: |
          buck2 test //crates/payroll-api:payroll_api_test
          buck2 test //crates/payroll-api:auth_session_validate_test
          buck2 test //crates/payroll-api:authz_decision_test
          buck2 test //crates/payroll-api:hr_employee_store_test
          buck2 test //crates/payroll-api:archive_intake_store_test
          buck2 test //crates/payroll-api:user_preference_store_test
          buck2 test //crates/payroll-api:workflow_template_store_test
          buck2 test //crates/payroll-api:postgres_migrate_test
          buck2 test //crates/payroll-api:cloud_native_audit_worker_test
