apiVersion: v1
kind: ConfigMap
metadata:
  name: bitween-runtime-config
  labels:
    app.kubernetes.io/name: bitween-runtime-config
data:
  BITWEEN_RUNTIME_MODE: production
  BITWEEN_DEFAULT_LOCALE: ko-KR
  BITWEEN_PUBLIC_TENANT_NAME: Acme Corporation
  BITWEEN_AUTH_REQUIRED: "true"
  BITWEEN_POSTGRES_TLS_POLICY: verify-full
  BITWEEN_POSTGRES_TENANT_ID: tenant-acme
  BITWEEN_POSTGRES_LEGAL_ENTITY_ID: acme-corp
  BITWEEN_POSTGRES_WORKPLACE_ID: seoul
  BITWEEN_RUSTFS_ENDPOINT: http://bitween-rustfs.bitween-prod.svc.cluster.local:9000
  BITWEEN_RUSTFS_BUCKET: bitween-archive-originals
  BITWEEN_RUSTFS_BUCKET_ARCHIVE: bitween-archive-originals
  BITWEEN_RUSTFS_BUCKET_EVIDENCE: bitween-audit-evidence
  BITWEEN_AUDIT_EXPORT_BUCKET: bitween-audit-evidence
  BITWEEN_AUDIT_EVENT_STREAM: postgres+otel
  BITWEEN_OTEL_SERVICE_NAMESPACE: bitween
  BITWEEN_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4317
  BITWEEN_HTTP_ALLOWED_ORIGIN: https://bitween.acme.internal
  RUST_LOG: info
